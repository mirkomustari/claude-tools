[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tools"
version = "0.1.0"
description = "Standard-library helpers for Claude Code sessions: mdcheck, ctxbudget"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mdcheck = "mdcheck:main"
ctxbudget = "ctxbudget:main"

[tool.setuptools]
py-modules = ["mdcheck", "ctxbudget"]
